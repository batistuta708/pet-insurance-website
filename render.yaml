# Render Blueprint: creates the web service and its PostgreSQL database in one go.
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: pet-insurance
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false   # set in the Render dashboard: comma-separated admin emails
      - key: DATABASE_URL
        fromDatabase:
          name: pet-insurance-db
          property: connectionString

databases:
  - name: pet-insurance-db
    plan: free
    region: frankfurt
    databaseName: pet_insurance
