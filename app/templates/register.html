{% extends 'base.html' %}

{% block title %}Create an account{% endblock %}

{% block content %}
<div class="page">
    <div class="wrap">
        <div class="auth">
            <h1>Create an account</h1>
            <form method="POST" action="{{ url_for('auth.register') }}" class="panel">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" autocomplete="email" required autofocus>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required aria-describedby="pw-hint">
                    <p class="hint" id="pw-hint">At least 8 characters.</p>
                </div>
                <button type="submit" class="btn btn-block">Create account</button>
            </form>
            <p class="switch">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
