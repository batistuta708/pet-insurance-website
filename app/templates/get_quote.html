{% extends 'base.html' %}

{% block title %}Get Quote{% endblock %}

{% block content %}
<h2>Get Your Pet Insurance Quote</h2>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="pet_name">Pet Name:</label><br>
    <input type="text" name="pet_name" id="pet_name" required><br><br>

    <label for="pet_type">Pet Type:</label><br>
    <select name="pet_type" id="pet_type" required>
        <option value="Dog">Dog</option>
        <option value="Cat">Cat</option>
        <option value="Other">Other</option>
    </select><br><br>

    <label for="pet_age">Pet Age:</label><br>
    <input type="number" name="pet_age" id="pet_age" min="0" max="30" required><br><br>

    <button type="submit">Generate Quote</button>
</form>
{% endblock %}
