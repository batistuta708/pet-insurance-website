{% extends 'base.html' %}

{% block title %}Add a pet{% endblock %}

{% block content %}
{% set chosen_type = request.args.get('type', '') %}
{% set chosen_age = request.args.get('age', '') %}
<div class="page">
    <div class="wrap">
        <div class="auth">
            <h1>Add a pet</h1>
            <p style="color: var(--muted)">Cover starts straight away at the monthly price shown on your dashboard.</p>
            <form method="POST" class="panel">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field">
                    <label for="pet_name">Pet's name</label>
                    <input type="text" name="pet_name" id="pet_name" maxlength="50" required autofocus>
                </div>
                <div class="field">
                    <label for="pet_type">Type of pet</label>
                    <select name="pet_type" id="pet_type" required>
                        <option value="" disabled {% if not chosen_type %}selected{% endif %}>Choose one</option>
                        {% for t in ['Dog', 'Cat', 'Other'] %}
                        <option value="{{ t }}" {% if chosen_type == t %}selected{% endif %}>{{ t }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label for="pet_age">Age in years</label>
                    <input type="number" name="pet_age" id="pet_age" min="0" max="30" value="{{ chosen_age }}" required>
                </div>
                <button type="submit" class="btn btn-block">Add pet and start cover</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
