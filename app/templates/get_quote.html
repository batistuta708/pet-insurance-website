{% extends 'base.html' %}

{% block title %}Get Quote{% endblock %}

{% block content %}
<h2>Get Your Pet Insurance Quote</h2>

<form method="POST" class="quote-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label for="pet_name">Pet Name:</label>
        <input type="text" name="pet_name" id="pet_name" placeholder="Enter your pet's name" required>
    </div>

    <div class="form-group">
        <label for="pet_type">Pet Type:</label>
        <select name="pet_type" id="pet_type" required>
            <option value="">Select pet type</option>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Other">Other</option>
        </select>
    </div>

    <div class="form-group">
        <label for="pet_age">Pet Age:</label>
        <input type="number" name="pet_age" id="pet_age" placeholder="Enter your pet's age" min="0" max="30" required>
    </div>

    <button type="submit" class="btn">Generate Quote</button>
</form>
{% endblock %}
